name: Auto Version & Release

# On every push to main: verify the commit, bump the patch version, tag it,
# and publish a GitHub Release. The checks run here because the push CI
# workflow is concurrent and cannot protect users from a broken release.
# Tags pushed by GITHUB_TOKEN do NOT trigger other workflows, so GoReleaser
# runs here directly — release.yml only serves human-pushed tags
# (minor/major bumps).
#
# Opt out for a single commit by including "[skip release]" in its message.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the tag + create the release

# Serialize runs so two pushes to main can never compute the same tag.
concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, needed to find the latest version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Compute next version
        id: version
        run: |
          if git log -1 --pretty=%B | grep -q '\[skip release\]'; then
            echo "Commit message contains [skip release] — not releasing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' | sort -V | tail -n1)
          latest=${latest:-v0.1.0} # base if no tags exist yet
          base="${latest#v}"
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "Bumping ${latest} -> ${next}"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      # A release must be gated by the exact commit being published, not a
      # concurrent CI run that may finish after users see the new version.
      - name: Check
        if: steps.version.outputs.skip != 'true'
        run: make check

      - name: Tag
        id: tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Run GoReleaser
        if: steps.version.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser requires a public tag, so remove it if publication fails
      # rather than leaving an installable-looking version without artifacts.
      - name: Remove tag after failed publication
        if: failure() && steps.tag.outcome == 'success'
        run: |
          git push --delete origin "${{ steps.version.outputs.next }}"
          git tag --delete "${{ steps.version.outputs.next }}"
